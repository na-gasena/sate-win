name: Windows Port

on:
  push:
    branches: [windows, 'port/**', 'fix/**', 'sync/**']
  pull_request:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Reject increases over the upstream lint baseline
        run: pnpm lint:check
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles nsis
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: pnpm tauri build --bundles app
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: sate-windows-x64-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
